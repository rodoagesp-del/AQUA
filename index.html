<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prorrateo de Servicios</title>
    
    <!-- Enlace al Manifest para PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Enlace a tu CSS modularizado -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen text-gray-800">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <div class="mb-6">
                <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-300">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800">Prorrateo App</h2>
                <p class="text-gray-500 text-sm mt-2">Bienvenido, por favor identifícate</p>
            </div>
            
            <button onclick="entrarComoInvitado()" class="btn-animate w-full bg-indigo-50 text-indigo-700 font-semibold py-3 rounded-xl border border-indigo-200 hover:bg-indigo-100 mb-6">
                Entrar como Invitado (Ver datos)
            </button>
            
            <div class="relative flex py-2 items-center mb-6">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">O entra como Admin</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <div class="space-y-4">
                <input type="password" id="dev-password" placeholder="Contraseña Desarrollador" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                <button onclick="entrarComoDev()" class="btn-animate w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl hover:from-blue-600 hover:to-indigo-700">
                    Ingresar
                </button>
            </div>
        </div>
    </div>

    <!-- SECCIÓN DE LA APLICACIÓN -->
    <div id="app-section" style="display:none;" class="max-w-6xl mx-auto p-4 md:p-6 pb-20">
        
        <!-- Cabecera -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-6 gap-4">
            <h1 class="text-xl md:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">
                Dashboard de Prorrateo
            </h1>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="select-servicio-vista" onchange="cambiarServicioActual(this)" class="flex-grow md:flex-grow-0 px-4 py-2 rounded-lg border border-gray-300 bg-gray-50 focus:outline-none font-semibold text-gray-700"></select>
                <button onclick="location.reload()" class="btn-animate bg-red-50 text-red-600 px-4 py-2 rounded-lg font-medium hover:bg-red-100 text-sm whitespace-nowrap">
                    Salir
                </button>
            </div>
        </div>
        
        <!-- Controles de Desarrollador (Oculto para invitados) -->
        <div id="dev-controls" style="display:none;" class="bg-white p-4 md:p-6 rounded-2xl shadow-lg mb-8 border-t-4 border-blue-500">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h3 class="text-xl font-bold text-gray-800 flex items-center">
                    <svg class="w-6 h-6 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    Gestión e Ingreso de Datos
                </h3>
                
                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <select id="select-servicio" onchange="cambiarServicioActual(this)" class="px-3 py-2 rounded-lg border border-gray-300 font-semibold"></select>
                    <button onclick="agregarServicio()" class="bg-green-100 text-green-700 px-3 py-2 rounded-lg text-sm font-bold">+ Servicio</button>
                    <button onclick="eliminarServicio()" class="bg-red-100 text-red-700 px-3 py-2 rounded-lg text-sm font-bold">- Servicio</button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-blue-50 p-4 rounded-xl border border-blue-100">
                <div>
                    <label class="block text-sm font-bold text-blue-900 mb-1">Fecha de Medición</label>
                    <input type="date" id="input-fecha" class="w-full px-4 py-2 rounded-lg border border-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-blue-900 mb-1">Consumo General</label>
                    <input type="number" id="input-consumo-general" placeholder="Ej. 54" class="w-full px-4 py-2 rounded-lg border border-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-blue-900 mb-1">Costo General (S/)</label>
                    <input type="number" id="input-costo-general" placeholder="Ej. 272" class="w-full px-4 py-2 rounded-lg border border-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            
            <div class="flex justify-between items-end border-b pb-2 mb-4">
                <h4 class="text-md font-semibold text-gray-700">Medidas por Usuario <span class="text-xs font-normal text-gray-500">(Medida 1 autocompletada)</span></h4>
                <button onclick="agregarUsuario()" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-sm font-bold">+ Agregar Usuario</button>
            </div>
            
            <!-- Contenedor Dinámico de Usuarios -->
            <div id="usuarios-inputs-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>
            
            <button id="btn-guardar" onclick="prepararYGuardar()" class="btn-animate w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl text-lg flex justify-center items-center">
                Calcular y Guardar en Google Sheets
            </button>
        </div>

        <div id="visualizer" class="space-y-8">
            <!-- Gráfica -->
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-lg">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Historial de Pagos Individuales</h3>
                <div class="relative h-64 md:h-80 w-full">
                    <canvas id="graficaConsumo"></canvas>
                </div>
            </div>
            
            <!-- Tabla y Tarjetas Responsivas -->
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-lg">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Registro Histórico Detallado</h3>
                
                <!-- Vista Celular (Tarjetas) -->
                <div id="tarjetas-mobile" class="block md:hidden"></div>

                <!-- Vista Escritorio (Tabla) -->
                <div class="hidden md:block overflow-x-auto rounded-xl border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Fecha</th>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Usuario</th>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Medidas</th>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase bg-blue-50">Consumo</th>
                                <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Total Gral.</th>
                                <th class="px-4 py-3 text-left font-bold text-green-600 uppercase bg-green-50">Pago</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-container" class="bg-white divide-y divide-gray-100"></tbody>
                    </table>
                </div>
                
                <div id="loading-indicator" class="text-center py-8 hidden">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts modularizados en el orden correcto -->
    <script src="js/math.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
